name: Run All Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm run test:all
      - run: npm run bdd
      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        with:
          name: reports
          path: reports/
 